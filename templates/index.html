<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دستیار هوش مصنوعی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f172a;
    --bg-soft: #1e293b;
    --card: #1e293b;
    --accent: #6366f1;
    --accent-2: #8b5cf6;
    --text: #e2e8f0;
    --text-dim: #94a3b8;
    --user-bubble: linear-gradient(135deg, #6366f1, #8b5cf6);
    --bot-bubble: #334155;
    --border: #334155;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Vazirmatn', system-ui, sans-serif;
    background: radial-gradient(circle at 20% 0%, #1e1b4b 0%, var(--bg) 45%);
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
    min-height: 100vh;
  }
  .app {
    width: 100%;
    max-width: 820px;
    height: 90vh;
    max-height: 880px;
    background: var(--card);
    border-radius: 24px;
    box-shadow: 0 25px 60px rgba(0,0,0,.5), 0 0 0 1px var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    padding: 18px 22px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    background: linear-gradient(135deg, rgba(99,102,241,.15), rgba(139,92,246,.15));
  }
  .logo {
    width: 40px; height: 40px;
    border-radius: 12px;
    background: var(--user-bubble);
    display: grid; place-items: center;
    font-size: 20px;
    box-shadow: 0 4px 14px rgba(99,102,241,.4);
  }
  header h1 { font-size: 17px; font-weight: 700; }
  header p { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .status {
    margin-inline-start: auto;
    font-size: 12px;
    color: #22c55e;
    display: flex; align-items: center; gap: 6px;
  }
  .status::before {
    content: "";
    width: 8px; height: 8px; border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 0 8px #22c55e;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; }
    50% { opacity: .4; }
  }
  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scroll-behavior: smooth;
  }
  .chat::-webkit-scrollbar { width: 6px; }
  .chat::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
  .msg {
    display: flex;
    gap: 10px;
    max-width: 85%;
    animation: fadeIn .25s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.user { align-self: flex-start; flex-direction: row-reverse; }
  .msg.bot { align-self: flex-end; }
  .avatar {
    width: 34px; height: 34px; border-radius: 10px;
    display: grid; place-items: center;
    font-size: 16px;
    flex-shrink: 0;
  }
  .msg.user .avatar { background: var(--user-bubble); }
  .msg.bot .avatar { background: #475569; }
  .bubble {
    padding: 12px 16px;
    border-radius: 16px;
    line-height: 1.75;
    font-size: 14.5px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user .bubble {
    background: var(--user-bubble);
    color: #fff;
    border-top-right-radius: 4px;
  }
  .msg.bot .bubble {
    background: var(--bot-bubble);
    border-top-left-radius: 4px;
  }
  .typing { display: flex; gap: 4px; padding: 4px 0; }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--text-dim);
    animation: bounce 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: .15s; }
  .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce {
    0%,60%,100% { transform: translateY(0); opacity: .5; }
    30% { transform: translateY(-6px); opacity: 1; }
  }
  form {
    padding: 14px 18px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    background: var(--bg-soft);
  }
  textarea {
    flex: 1;
    resize: none;
    background: #0f172a;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 16px;
    color: var(--text);
    font-family: inherit;
    font-size: 14.5px;
    line-height: 1.5;
    max-height: 120px;
    outline: none;
    transition: border-color .2s;
  }
  textarea:focus { border-color: var(--accent); }
  button {
    padding: 0 22px;
    border: none;
    border-radius: 14px;
    background: var(--user-bubble);
    color: white;
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    transition: transform .15s, opacity .2s;
  }
  button:hover:not(:disabled) { transform: scale(1.03); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .clear-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 8px 14px;
    font-size: 12px;
    border-radius: 10px;
    margin-inline-start: auto;
  }
  .clear-btn:hover { color: var(--text); border-color: var(--accent); }
  @media (max-width: 600px) {
    .app { height: 100vh; max-height: none; border-radius: 0; }
    body { padding: 0; }
    .msg { max-width: 92%; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">🤖</div>
    <div>
      <h1>دستیار هوش مصنوعی</h1>
      <p>پاسخ‌گو به فارسی و سایر زبان‌ها</p>
    </div>
    <div class="status">آنلاین</div>
  </header>

  <div class="chat" id="chat">
    <div class="msg bot">
      <div class="avatar">🤖</div>
      <div class="bubble">سلام! 👋 من دستیار هوش مصنوعی هستم. هر سؤالی داری بپرس.</div>
    </div>
  </div>

  <form id="form">
    <textarea id="input" rows="1" placeholder="پیامت را بنویس..." required></textarea>
    <button type="submit" id="sendBtn">ارسال</button>
    <button type="button" class="clear-btn" id="clearBtn">پاک کردن</button>
  </form>
</div>

<script>
  const chat = document.getElementById('chat');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const clearBtn = document.getElementById('clearBtn');

  let messages = [];  // تاریخچه گفتگو

  function addMessage(role, text) {
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'user' ? '👤' : '🤖';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    wrap.appendChild(avatar);
    wrap.appendChild(bubble);
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
    return wrap;
  }

  function addTyping() {
    const wrap = document.createElement('div');
    wrap.className = 'msg bot';
    wrap.id = 'typing';
    wrap.innerHTML = '<div class="avatar">🤖</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById('typing');
    if (t) t.remove();
  }

  async function sendMessage(text) {
    messages.push({ role: 'user', content: text });
    addMessage('user', text);
    addTyping();
    sendBtn.disabled = true;

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages })
      });
      const data = await res.json();
      removeTyping();

      if (!res.ok) {
        addMessage('bot', '⚠️ ' + (data.error || 'خطای نامشخص'));
        messages.pop();
      } else {
        addMessage('bot', data.reply);
        messages.push({ role: 'assistant', content: data.reply });
      }
    } catch (err) {
      removeTyping();
      addMessage('bot', '⚠️ اتصال به سرور برقرار نشد.');
      messages.pop();
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    input.style.height = 'auto';
    sendMessage(text);
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });

  clearBtn.addEventListener('click', () => {
    messages = [];
    chat.innerHTML = '';
    addMessage('bot', 'حافظه پاک شد. از نو شروع کنیم! 😊');
    input.focus();
  });
</script>
</body>
</html>
